name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # No API keys and no network: the suite runs against fake embeddings, a fake
      # Firecrawl, scripted models, and a real MCP server spawned over stdio.
      - run: uv run pytest
